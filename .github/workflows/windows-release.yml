name: Build and publish 0.9.2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dsp408/version.py', '.github/workflows/windows-release.yml', 'tools/verify_windows_release.py']
permissions:
  contents: read
concurrency:
  group: release-0.9.2
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - run: python -m venv .venv
      - run: .venv\Scripts\python.exe -m pip install -r packaging/windows/requirements-lock.txt
      - run: choco install innosetup -y --no-progress --force
      - shell: pwsh
        run: ./tools/build_windows.ps1
      - shell: pwsh
        run: .venv\Scripts\python.exe tools/verify_windows_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*
          if-no-files-found: error
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: arm64
      - run: python -m pip install -r packaging/macos/requirements.txt -r packaging/macos/requirements-dmg.txt
      - run: python tools/build_macos.py --arch arm64
      - run: python tools/build_macos_dmg.py --arch arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            dist/macos/arm64/*.dmg
            dist/macos/arm64/*.dmg.sha256
          if-no-files-found: error
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          path: release-assets
          merge-multiple: true
      - name: Verify both platforms and checksums
        working-directory: release-assets
        run: |
          test -f DSP408FIR-Control-0.9.2-Setup.exe
          test -f DSP408FIR-Control-0.9.2-build170-macOS-arm64.dmg
          sha256sum -c *.sha256
      - name: Publish verified installers, then remove the two superseded releases
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cat > release-notes.txt <<'NOTES'
          DSP408FIR Control 0.9.2 / build170
          
          Application code: PolyForm Shield License 1.0.0.
          Full license included in the application, Windows installer and macOS DMG.
          Third-party components retain their original licenses.
          Previously distributed MIT versions retain their original terms.
          
          Windows x64 installer and macOS Apple Silicon DMG, with SHA-256 checksums.
          macOS uses an ad-hoc signature and is not Apple notarized.
          Copyright © 2026 Łukasz Białas · https://gremium.tech
          NOTES
          gh release create 0.9.2 --target "$RELEASE_SHA" --draft --title "DSP408FIR Control 0.9.2" --notes-file release-notes.txt release-assets/*
          gh release view 0.9.2 --json assets --jq '.assets | length' | grep -qx 4
          gh release edit 0.9.2 --draft=false --latest
          gh api "repos/$GH_REPO/releases" > releases.json
          python - <<'PY'
          import json,os,subprocess
          old_ids={417331221,417019479}
          for release in json.load(open("releases.json")):
              if release["id"] in old_ids:
                  subprocess.run(["gh","api","--method","DELETE",f'repos/{os.environ["GH_REPO"]}/releases/{release["id"]}'],check=True)
          PY
